<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05090d">
  <title>Нова парола · Bizomedia</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-brand-panel">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/bizomedia-logo.svg" alt="Bizomedia logo">
      <span class="brand-name">bizomedia</span>
    </a>
    <div class="auth-brand-copy">
      <p class="eyebrow">BIZOMEDIA CLIENT PORTAL</p>
      <h1>Сигурен достъп.<br><span class="gradient-text">Нова парола.</span></h1>
      <p>Избери нова парола за своя Bizomedia профил.</p>
    </div>
    <div class="auth-brand-footer">© 2026 Bizomedia · Варна, България</div>
  </section>
  <section class="auth-form-panel">
    <div class="auth-box">
      <a class="back-site" href="login.html">← Обратно към вход</a>
      <h2>Създай нова парола</h2>
      <p class="auth-subtitle">Паролата трябва да съдържа поне 8 символа.</p>
      <div class="auth-mode-banner"></div>
      <form class="auth-form" data-auth-form="update">
        <label><span>НОВА ПАРОЛА</span><div class="auth-input-wrap"><input type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="Поне 8 символа"><button type="button" class="password-toggle" aria-label="Покажи паролата">◉</button></div></label>
        <label><span>ПОВТОРИ ПАРОЛАТА</span><div class="auth-input-wrap"><input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required placeholder="Повтори паролата"><button type="button" class="password-toggle" aria-label="Покажи паролата">◉</button></div></label>
        <button class="gradient-button auth-submit full" type="submit">Запази новата парола</button>
      </form>
      <div class="auth-message"></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
