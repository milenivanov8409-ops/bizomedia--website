    <path d="M8 730C350 505 675 486 1000 700s443 164 603-32" stroke="#2e86ff" stroke-width="2"/>
    <path d="M70 790c340-208 690-230 1010-12s390 173 500 56" stroke="#7d4cff" stroke-width="2"/>
  </g>

  <!-- Laptop -->
