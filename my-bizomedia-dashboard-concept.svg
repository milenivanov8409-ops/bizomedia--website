<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">My Bizomedia Studio dashboard on a laptop and phone</title>
  <desc id="desc">A premium dark dashboard with calendar, analytics, content approvals and a mobile post approval screen.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bac5d3"/>
      <stop offset=".12" stop-color="#343e4b"/>
      <stop offset=".52" stop-color="#080b10"/>
      <stop offset=".86" stop-color="#303947"/>
      <stop offset="1" stop-color="#d1d8e2"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#697382"/>
      <stop offset=".35" stop-color="#202733"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#24e3d5"/>
      <stop offset=".48" stop-color="#2f9cff"/>
      <stop offset="1" stop-color="#8d4dff"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0edccc" stop-opacity=".28"/>
      <stop offset=".52" stop-color="#167ee8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7b43ff" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="postOne" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172b34"/>
      <stop offset=".55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#28135c"/>
    </linearGradient>
    <linearGradient id="postTwo" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#25124f"/>
      <stop offset=".5" stop-color="#0d2735"/>
      <stop offset="1" stop-color="#0a121d"/>
    </linearGradient>
    <radialGradient id="sceneGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#18d8d0" stop-opacity=".22"/>
      <stop offset=".48" stop-color="#256dff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#5f24ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <filter id="phoneShadow" x="-45%" y="-35%" width="190%" height="190%">
      <feDropShadow dx="-10" dy="30" stdDeviation="24" flood-color="#000" flood-opacity=".82"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#5732ff" flood-opacity=".16"/>
    </filter>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><rect x="120" y="90" width="1070" height="650" rx="24"/></clipPath>
    <clipPath id="phoneClip"><rect x="1171" y="335" width="285" height="579" rx="42"/></clipPath>
  </defs>

  <ellipse cx="760" cy="875" rx="720" ry="105" fill="#000" opacity=".55"/>
  <ellipse cx="830" cy="495" rx="710" ry="420" fill="url(#sceneGlow)"/>
  <g fill="none" stroke-linecap="round" opacity=".42">
